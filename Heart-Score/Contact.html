<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <link rel="stylesheet" href="./Style.css">

</head>

<body>
  <div class="logo">
    <img src="99e344f6dd2e4954b03df639266edf9e-removebg-preview.png">
</div>
  
  <div class="background">
    <div class="container">
      <div class="screen">
        <div class="screen-header">
          <div class="screen-header-left">
            <div class="screen-header-button close"></div>
            <div class="screen-header-button maximize"></div>
            <div class="screen-header-button minimize"></div>
          </div>
          <div class="screen-header-right">
            <div class="screen-header-ellipsis"></div>
            <div class="screen-header-ellipsis"></div>
            <div class="screen-header-ellipsis"></div>
          </div>
        </div>
        <form action="mailto:heartscore1234@gmail.com?subject=Contact Me" method="post" enctype="text/plain">
        <div class="screen-body">
          <div class="screen-body-item left">
            <div class="app-title">
              <span>CONTACT</span>
              <span>US</span>
            </div>
            <div class="app-contact">CONTACT INFO : +91 8279700718</div>
          </div>
          <div class="screen-body-item">
            <div class="app-form">
              <div class="app-form-group">
                
                <input class="app-form-control" type="text" placeholder="NAME" name= "Customer Name">
              </div>
              <div class="app-form-group">
                <input class="app-form-control" type="text" placeholder="CONTACT NO" name= "Contact Number">
              </div>
              <div class="app-form-group message">
                <input class="app-form-control" type="text" placeholder="MESSAGE" name="Message">
              </div>
              <div class="app-form-group buttons">
                <button class="app-form-button">SEND</button>
              </div>
            </div>
          </div>
        </div>
      </form>
      </div>
      
    </div>
  </div>

</body>

</html>
